<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Tiles Renderer Gaussian Splat Plugin Examples</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="splat-count">
      Rendered splats: <output id="rendered-splat-count">0</output>
    </div>
    <script type="module">
      import GUI from 'three/examples/jsm/libs/lil-gui.module.min.js';
      import { runExample } from './shared/viewer.js';

      const tilesets = [
        {
          name: 'gaussianSplat1',
          url: '/gaussianSplat1/tileset.json',
        },
        {
          name: 'gaussianSplat2',
          url: '/gaussianSplat2/tileset.json',
        },
      ];

      const viewer = runExample({ tilesets });
      const errorTargetRange = {
        min: 4,
        middle: 16,
        max: 64,
      };
      const errorTargetFromPosition = (position) =>
        Math.round(
          errorTargetRange.min *
            (errorTargetRange.max / errorTargetRange.min) ** position,
        );
      viewer.setErrorTarget(errorTargetRange.middle);

      const state = {
        tileset: tilesets[0].name,
        errorTargetPosition: 0.5,
        moveToTileset: () => viewer.moveToTileset(),
      };
      const nameToUrl = Object.fromEntries(
        tilesets.map((t) => [t.name, t.url]),
      );

      const gui = new GUI({ title: 'Tilesets' });
      gui
        .add(
          state,
          'tileset',
          tilesets.map((t) => t.name),
        )
        .name('Tileset')
        .onChange((name) => viewer.switchTileset(nameToUrl[name]));
      const errorTargetOutput = document.createElement('output');
      errorTargetOutput.className = 'error-target-value';
      errorTargetOutput.textContent = String(errorTargetRange.middle);
      const errorTargetController = gui
        .add(state, 'errorTargetPosition', 0, 1)
        .name('Error target')
        .onChange((position) => {
          const errorTarget = errorTargetFromPosition(position);
          viewer.setErrorTarget(errorTarget);
          errorTargetOutput.textContent = String(errorTarget);
        });
      errorTargetController.domElement.classList.add(
        'error-target-controller',
      );
      errorTargetController.$input.replaceWith(errorTargetOutput);
      gui.add(state, 'moveToTileset').name('Move to tileset');
    </script>
  </body>
</html>
